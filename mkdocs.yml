site_name: JA2 v1.13 Documentation
site_description: >-
  Community documentation for Jagged Alliance 2 v1.13 — installation, gameplay,
  configuration, modding and development.
site_url: https://1dot13.github.io/documentation/
repo_url: https://github.com/1dot13/documentation
repo_name: 1dot13/documentation
edit_uri: edit/master/docs/

copyright: >-
  Maintained by the JA2 v1.13 community —
  <a href="https://thepit.ja-galaxy-forum.com">The Bear's Pit</a>

theme:
  name: material
  logo: assets/113.png
  favicon: assets/113.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - social:
      enabled: !ENV [CI, false]
  - git-revision-date-localized:
      enable_creation_date: false
      fallback_to_build_date: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/1dot13
      name: JA2 v1.13 on GitHub
    - icon: fontawesome/brands/discord
      link: https://discord.gg/GqrVZUM
      name: The Bear's Pit Discord
    - icon: material/forum
      link: https://thepit.ja-galaxy-forum.com
      name: The Bear's Pit forums

